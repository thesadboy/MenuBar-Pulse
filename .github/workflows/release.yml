name: Release & Build DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode Command Line Tools
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true
          swift --version

      - name: Build & Package DMG
        run: |
          cd MenuBarPulse
          bash package_dmg.sh

      - name: Verify DMG Output
        run: |
          ls -lh MenuBarPulse.dmg

      - name: Determine Tag
        id: tag_step
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_step.outputs.TAG_NAME }}
          name: "MenuBar Pulse ${{ steps.tag_step.outputs.TAG_NAME }}"
          files: MenuBarPulse.dmg
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
